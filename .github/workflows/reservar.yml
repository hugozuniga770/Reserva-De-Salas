name: Bot de Reservas 24/7

on:
  schedule:
    # TURNO 1: 14:00 a 20:00 (Hora Bolivia)
    - cron: '0 18 * * *'
    
    # TURNO 2: 20:00 a 02:00 (Hora Bolivia)
    - cron: '0 0 * * *'
    
    # TURNO 3: 02:00 a 08:00 (Hora Bolivia)
    - cron: '0 6 * * *'
    
    # TURNO 4: 08:00 a 14:00 (Hora Bolivia)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ejecutar-bucle:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: pip install -r requirements.txt

    - name: Correr el Bucle de Reservas
      run: python bucle.py

    - name: Guardar captura de pantalla del último error
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot-final
        path: error_screenshot.png
