name: Francotirador Sala F 24/7

on:
  schedule:
    # Este cron lanza el bot en el minuto 0 de cada 2 horas (00:00, 02:00, 04:00...)
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Esta regla evita que tengas múltiples bots corriendo al mismo tiempo por accidente
concurrency:
  group: francotirador-bot
  cancel-in-progress: true

jobs:
  cazar-sala:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Selenium
      run: pip install selenium 

    - name: Iniciar Francotirador (Turno de 2 horas)
      run: python reserva_agresiva.py
