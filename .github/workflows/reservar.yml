name: Reserva Sala UPB

# El nombre de cada corrida (visible para todos en Actions y en el panel) nunca lleva datos personales.
# OJO: va entre comillas dobles. Sin comillas, YAML toma « #» como inicio de comentario y corta la línea.
run-name: "${{ inputs.ticket && format('Solicitud #{0}', inputs.ticket) || ((inputs.dry_run == true || inputs.dry_run == 'true') && 'Prueba sin reservar' || 'Tu reserva') }}"

# ─────────────────────────────────────────────────────────────────────────────
# TU CORRIDA (sin "ticket"): la lanza el RELEVO (relevo.yml) a las 18:45 BO por
# workflow_dispatch, que arranca en segundos. Estos 5 cron son solo respaldo: GitHub
# los retrasa horas. Espera sola hasta la apertura de las 20:00 BO y termina a las
# 21:15 BO. Además lanza la corrida AISLADA de cada ticket aprobado.
#
# CORRIDA DE TICKET (input "ticket"): una por solicitud, en su propio carril, en
# paralelo con la tuya. Solo conoce los datos de ESA persona; al terminar los borra.
# GitHub usa UTC. Bolivia = UTC-4.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '47 19 * * *'   # 15:47 BO
    - cron: '53 20 * * *'   # 16:53 BO
    - cron: '37 21 * * *'   # 17:37 BO
    - cron: '11 22 * * *'   # 18:11 BO
    - cron: '41 22 * * *'   # 18:41 BO
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Número de solicitud (vacío = tu reserva)'
        required: false
        default: ''
      salas:
        description: 'IDs de sala en orden de preferencia (8=F, 6=D, 15=B, 3=C, 9=G, 14=H)'
        required: false
        default: ''
      horario:
        description: 'Horario, p. ej. 12:15-14:15'
        required: false
        default: ''
      minutos:
        description: 'Vigilar N minutos desde ya (vacío = hasta las 21:15 BO)'
        required: false
        default: ''
      dry_run:
        description: 'Prueba sin reservar'
        type: boolean
        default: false
      origen:
        description: 'Quién lanza (vacío = a mano; "relevo" = relevo.yml, respeta la pausa)'
        required: false
        default: ''

# Carriles: TU corrida usa uno solo (nunca dos tuyas a la vez, y nunca se mata una
# que está enviando). Cada TICKET tiene su propio carril → corren en paralelo.
concurrency:
  group: "${{ inputs.ticket && format('upb-ticket-{0}', inputs.ticket) || 'reserva-sala-upb' }}"
  cancel-in-progress: false

# Permisos mínimos: leer el código, comentar/cerrar tickets y lanzar corridas de tickets.
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  reservar:
    # Candado: solo corre en el repositorio original (ver LICENSE). En copias no hace nada.
    # "Pausar" desde el panel frena los automáticos (cron y relevo); "Correr bot ahora" siempre funciona.
    if: github.repository == 'hugozuniga770/Reserva-De-Salas' && ((github.event_name != 'schedule' && inputs.origen != 'relevo') || vars.UPB_PAUSADO != '1')
    runs-on: ubuntu-latest
    timeout-minutes: 355        # GitHub corta a los 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reservar (con verificación)
        id: bot
        env:
          # Lo que cambias desde el panel (Variables) manda sobre los Secrets.
          UPB_NOMBRE:    ${{ vars.UPB_NOMBRE    || secrets.UPB_NOMBRE }}
          UPB_APELLIDO:  ${{ vars.UPB_APELLIDO  || secrets.UPB_APELLIDO }}
          UPB_PROPOSITO: ${{ vars.UPB_PROPOSITO || 'Estudio académico' }}
          UPB_CODIGO:    ${{ secrets.UPB_CODIGO }}
          NTFY_TOPIC:    ${{ secrets.NTFY_TOPIC }}
          UPB_SALAS:     ${{ inputs.salas   || vars.UPB_SALAS   || '8,6,15,3' }}
          UPB_HORARIO:   ${{ inputs.horario || vars.UPB_HORARIO || '12:15-14:15' }}
          UPB_DRY_RUN:   "${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '1' || '0' }}"
          UPB_APERTURA_BO: '20:00'
          UPB_HASTA_BO:    ${{ inputs.minutos == '' && '21:15' || '' }}   # termina a las 21:15 BO
          UPB_MAX_MINUTOS: ${{ inputs.minutos || '340' }}                 # tope de seguridad
          # Tickets (solicitudes cifradas de otros estudiantes)
          UPB_TICKET:          ${{ inputs.ticket }}
          UPB_GH_TOKEN:        ${{ github.token }}
          UPB_REPO:            ${{ github.repository }}
          UPB_CLAVE_PRIVADA:   ${{ secrets.UPB_CLAVE_PRIVADA }}
          UPB_AUTO_APROBAR:    ${{ vars.UPB_AUTO_APROBAR    || '1' }}
          UPB_AUTO_APROBAR_BO: ${{ vars.UPB_AUTO_APROBAR_BO || '18:30' }}
          UPB_MAX_PERSONAS:    ${{ vars.UPB_MAX_PERSONAS    || '4' }}
          UPB_MAX_POR_PERSONA: ${{ vars.UPB_MAX_POR_PERSONA || '2' }}
        run: python reserva_bot.py

      # Resultado legible: solo se ejecuta el paso que corresponde (los demás quedan «skipped»).
      # El panel lee cuál corrió para decir «Reservada», «No se liberó», etc. Ver RESULTADOS en reserva_bot.py.
      - name: "Resultado: reservada"
        if: always() && steps.bot.outputs.resultado == 'reservada'
        run: 'echo "Reservada y verificada en el calendario"'
      - name: "Resultado: ya-la-tenia"
        if: always() && steps.bot.outputs.resultado == 'ya-la-tenia'
        run: 'echo "Ya tenía la reserva: no hizo nada"'
      - name: "Resultado: no-se-libero"
        if: always() && steps.bot.outputs.resultado == 'no-se-libero'
        run: 'echo "No se liberó ninguna sala"'
      - name: "Resultado: pendiente"
        if: always() && steps.bot.outputs.resultado == 'pendiente'
        run: 'echo "Solicitud sin sala por ahora: queda abierta y se relanza"'
      - name: "Resultado: nada"
        if: always() && steps.bot.outputs.resultado == 'nada'
        run: 'echo "Nada que hacer (horario pasado o apertura fuera de esta corrida)"'
      - name: "Resultado: prueba"
        if: always() && steps.bot.outputs.resultado == 'prueba'
        run: 'echo "Prueba sin reservar"'
      - name: "Resultado: descartada"
        if: always() && steps.bot.outputs.resultado == 'descartada'
        run: 'echo "Solicitud descartada (datos inválidos o sala no disponible)"'
      - name: "Resultado: inactivo"
        if: always() && steps.bot.outputs.resultado == 'inactivo'
        run: 'echo "Solicitud ya no activa (eliminada, cerrada o rechazada)"'
      - name: "Resultado: tarde"
        if: always() && steps.bot.outputs.resultado == 'tarde'
        run: 'echo "Arrancó tarde, después de la apertura, sin sala"'
      - name: "Resultado: error"
        if: always() && steps.bot.outputs.resultado == 'error'
        run: 'echo "Error: revisar el registro (configuración, rechazo de la UPB, sitio caído o copia)"'

      # Si la corrida de un ticket se corta (cancelada, error, tiempo), el ticket se
      # libera para que tu corrida lo vuelva a lanzar. Nunca queda trabado.
      - name: Liberar ticket
        if: always() && inputs.ticket != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ inputs.ticket }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$TICKET" --repo "$REPO" --remove-label en-curso || true
