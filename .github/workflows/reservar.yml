name: Bot de Reservas Escalonado

on:
  schedule:
    # Inicia el proceso a las 20:01 (00:01 UTC)
    - cron: '1 0 * * *'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

