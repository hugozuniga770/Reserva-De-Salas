name: Reserva Sala UPB

# El nombre de cada corrida (visible para todos en Actions y en el panel) nunca lleva datos personales.
run-name: ${{ inputs.ticket && format('Solicitud #{0}', inputs.ticket) || (inputs.dry_run && 'Prueba sin reservar' || 'Tu reserva') }}

# ─────────────────────────────────────────────────────────────────────────────
# TU CORRIDA (sin "ticket"): arranca con cualquiera de estos 5 horarios (GitHub los
# retrasa a veces horas, por eso son varios), espera sola hasta la apertura de las
# 20:00 BO y termina a las 21:15 BO. Además lanza la corrida AISLADA de cada ticket.
#
# CORRIDA DE TICKET (input "ticket"): una por solicitud, en su propio carril, en
# paralelo con la tuya. Solo conoce los datos de ESA persona; al terminar los borra.
# GitHub usa UTC. Bolivia = UTC-4.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '47 19 * * *'   # 15:47 BO
    - cron: '53 20 * * *'   # 16:53 BO
    - cron: '37 21 * * *'   # 17:37 BO
    - cron: '11 22 * * *'   # 18:11 BO
    - cron: '41 22 * * *'   # 18:41 BO
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Número de solicitud (vacío = tu reserva)'
        required: false
        default: ''
      salas:
        description: 'IDs de sala en orden de preferencia (8=F, 6=D, 15=B, 3=C, 9=G, 14=H)'
        required: false
        default: ''
      horario:
        description: 'Horario, p. ej. 12:15-14:15'
        required: false
        default: ''
      minutos:
        description: 'Vigilar N minutos desde ya (vacío = hasta las 21:15 BO)'
        required: false
        default: ''
      dry_run:
        description: 'Prueba sin reservar'
        type: boolean
        default: false

# Carriles: TU corrida usa uno solo (nunca dos tuyas a la vez, y nunca se mata una
# que está enviando). Cada TICKET tiene su propio carril → corren en paralelo.
concurrency:
  group: ${{ inputs.ticket && format('upb-ticket-{0}', inputs.ticket) || 'reserva-sala-upb' }}
  cancel-in-progress: false

# Permisos mínimos: leer el código, comentar/cerrar tickets y lanzar corridas de tickets.
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  reservar:
    # "Pausar" desde el panel solo frena los automáticos; "Correr bot ahora" siempre funciona.
    if: github.event_name != 'schedule' || vars.UPB_PAUSADO != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 355        # GitHub corta a los 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reservar (con verificación)
        env:
          # Lo que cambias desde el panel (Variables) manda sobre los Secrets.
          UPB_NOMBRE:    ${{ vars.UPB_NOMBRE    || secrets.UPB_NOMBRE }}
          UPB_APELLIDO:  ${{ vars.UPB_APELLIDO  || secrets.UPB_APELLIDO }}
          UPB_PROPOSITO: ${{ vars.UPB_PROPOSITO || 'Estudio académico' }}
          UPB_CODIGO:    ${{ secrets.UPB_CODIGO }}
          NTFY_TOPIC:    ${{ secrets.NTFY_TOPIC }}
          UPB_SALAS:     ${{ inputs.salas   || vars.UPB_SALAS   || '8,6,15,3' }}
          UPB_HORARIO:   ${{ inputs.horario || vars.UPB_HORARIO || '12:15-14:15' }}
          UPB_DRY_RUN:   ${{ inputs.dry_run && '1' || '0' }}
          UPB_APERTURA_BO: '20:00'
          UPB_HASTA_BO:    ${{ inputs.minutos == '' && '21:15' || '' }}   # termina a las 21:15 BO
          UPB_MAX_MINUTOS: ${{ inputs.minutos || '340' }}                 # tope de seguridad
          # Tickets (solicitudes cifradas de otros estudiantes)
          UPB_TICKET:          ${{ inputs.ticket }}
          UPB_GH_TOKEN:        ${{ github.token }}
          UPB_REPO:            ${{ github.repository }}
          UPB_CLAVE_PRIVADA:   ${{ secrets.UPB_CLAVE_PRIVADA }}
          UPB_AUTO_APROBAR:    ${{ vars.UPB_AUTO_APROBAR    || '1' }}
          UPB_AUTO_APROBAR_BO: ${{ vars.UPB_AUTO_APROBAR_BO || '18:30' }}
          UPB_MAX_PERSONAS:    ${{ vars.UPB_MAX_PERSONAS    || '4' }}
        run: python reserva_bot.py

      # Si la corrida de un ticket se corta (cancelada, error, tiempo), el ticket se
      # libera para que tu corrida lo vuelva a lanzar. Nunca queda trabado.
      - name: Liberar ticket
        if: always() && inputs.ticket != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ inputs.ticket }}" --repo "${{ github.repository }}" --remove-label en-curso || true
