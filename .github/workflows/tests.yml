name: Tests

on:
  push:
  pull_request:

jobs:
  bot:
    name: Bot (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml
      - name: Instalar actionlint (valida los workflows como GitHub)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Validar workflows
        run: ./actionlint -color
      - run: python -m pytest -q          # incluye la compatibilidad de cifrado con Node (docs/cifrado.js)

  panel:
    name: Panel (Chromium de punta a punta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/panel_e2e.py capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-del-panel
          path: capturas/
