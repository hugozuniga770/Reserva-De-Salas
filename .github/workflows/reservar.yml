        python-version: '3.11'

    - name: Instalar Selenium
      run: pip install -r requirements.txt

    # --- INTENTO 1: 20:01 ---
    - name: Intento 1 (20:01) - reserva.py
      id: intento1
      continue-on-error: true # Permite que el proceso no se rompa si falla
      run: python reserva.py

    # --- INTENTO 2: 20:05 ---
    - name: Pausa de 4 minutos
      if: steps.intento1.outcome == 'failure'
      run: sleep 240

